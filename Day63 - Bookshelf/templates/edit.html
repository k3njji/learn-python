<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {%if book%}
        <h1>Edit Book</h1>
        <form method="POST">
            <label for="rating">Rating:</label>
            <input type="number" id="rating" name="rating" step="0.1" value="{{ book.rating }}" required>
            <button type="submit">Update Rating</button>
        </form>
    {%else%}
        <p>Book not found.</p>
    {%endif%}
</body>
</html>
