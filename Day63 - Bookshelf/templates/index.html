<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>
    {% if books%}
    <ul>
      {%for book in books%}
      <li><a href="{{url_for('delete', book_id=book.id)}}">Delete</a> || {{ book.title }} by {{ book.author }} - Rating: {{ book.rating }}/10 || <a href="{{url_for('edit', book_id=book.id)}}">Edit</a></li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No books in the library yet.</p>
    {% endif %}


    <a href="{{ url_for('add') }}">Add New Book</a>
  </body>
</html>
